spring.application.name=eventos-api
server.port=8080

# --- PostgreSQL (crie o banco "eventos_db" no pgAdmin 4 antes de rodar) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logs ---
logging.level.br.com.eventos=INFO
